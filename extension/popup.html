<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #ffffff;
      color: #111827;
    }

    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #f3f4f6;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-icon {
      width: 28px;
      height: 28px;
      background: #eef2ff;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .header-title {
      font-size: 13px;
      font-weight: 600;
      color: #111827;
    }

    .header-sub {
      font-size: 11px;
      color: #9ca3af;
    }

    .body {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* ── Estado idle ── */
    #state-idle { display: flex; flex-direction: column; gap: 10px; }
    #state-idle p {
      font-size: 12px;
      color: #6b7280;
      line-height: 1.5;
      text-align: center;
    }

    /* ── Estado a gravar ── */
    #state-recording { display: none; flex-direction: column; gap: 10px; align-items: center; }

    .rec-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
      color: #dc2626;
    }

    .rec-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #dc2626;
      animation: pulse 1.2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    .timer {
      font-size: 28px;
      font-weight: 300;
      color: #111827;
      font-variant-numeric: tabular-nums;
      letter-spacing: 0.05em;
    }

    .meet-label {
      font-size: 11px;
      color: #9ca3af;
    }

    /* ── Botões ── */
    .btn-primary {
      background: #6366f1;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 9px 14px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: #4f46e5; }
    .btn-primary.danger { background: #dc2626; }
    .btn-primary.danger:hover { background: #b91c1c; }

    .btn-secondary {
      background: transparent;
      color: #374151;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 12px;
      cursor: pointer;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.15s;
    }
    .btn-secondary:hover { background: #f9fafb; }

    .not-meet {
      padding: 16px;
      text-align: center;
      font-size: 12px;
      color: #9ca3af;
      line-height: 1.6;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="header-icon">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#6366f1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="23"/>
        <line x1="8" y1="23" x2="16" y2="23"/>
      </svg>
    </div>
    <div>
      <div class="header-title">Meeting Intelligence</div>
      <div class="header-sub" id="header-sub">Pronto</div>
    </div>
  </div>

  <div class="body" id="main-body">

    <!-- Não está no Meet -->
    <div id="not-meet" class="not-meet" style="display:none">
      Abre o <strong>Google Meet</strong> para usar a extensão.
    </div>

    <!-- Idle -->
    <div id="state-idle">
      <p>Clica para começar a gravar e transcrever a reunião.</p>
      <button class="btn-primary" id="btn-start">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="12" r="8"/></svg>
        Iniciar gravação
      </button>
    </div>

    <!-- A gravar -->
    <div id="state-recording">
      <div class="rec-indicator">
        <div class="rec-dot"></div>
        A gravar
      </div>
      <div class="timer" id="timer">00:00:00</div>
      <div class="meet-label" id="meet-label">Google Meet</div>
      <button class="btn-primary danger" id="btn-stop">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Parar gravação
      </button>
      <button class="btn-secondary" id="btn-sidebar">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="15" y1="3" x2="15" y2="21"/></svg>
        Abrir análise
      </button>
    </div>

  </div>

  <script src="config.js"></script>
  <script src="popup.js"></script>
</body>
</html>
